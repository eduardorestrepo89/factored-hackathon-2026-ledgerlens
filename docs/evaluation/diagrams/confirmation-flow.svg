.conf-root .conf-group{fill:var(--soft);stroke:var(--line);stroke-width:1.25}
.conf-root .conf-eval{fill:var(--surface);stroke:var(--accent);stroke-width:1.75;stroke-dasharray:6 4}
.conf-root .conf-note{fill:var(--surface);stroke:var(--line);stroke-width:1}
.conf-root .conf-none{fill:none;stroke:var(--line);stroke-width:1.25;stroke-dasharray:4 4}
