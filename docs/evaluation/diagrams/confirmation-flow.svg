.conf-root .conf-badge{fill:var(--surface);stroke:var(--accent);stroke-width:1.75}
.conf-root .conf-dot{fill:var(--ink);stroke:none}
.conf-root .conf-ln{fill:none;stroke:var(--ink);stroke-width:1.4}
.conf-root .conf-ln-a{fill:none;stroke:var(--accent);stroke-width:1.75}
.conf-root .conf-ln-d{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
.conf-root .conf-life{fill:none;stroke:var(--line);stroke-width:1.25;stroke-dasharray:3 4}
.conf-root .conf-hd{fill:var(--ink);stroke:none}
.conf-root .conf-hd-a{fill:var(--accent);stroke:none}
.conf-root .conf-hd-m{fill:var(--muted);stroke:none}
.conf-root text{font-family:var(--body);font-size:13px;fill:var(--ink);stroke:none}
.conf-root .conf-h{font-family:var(--display);font-size:14px;font-weight:600}
.conf-root .conf-hl{font-family:var(--display);font-size:15px;font-weight:600}
.conf-root .conf-m{fill:var(--muted)}
.conf-root .conf-c{font-family:var(--mono);font-size:12px}
.conf-root .conf-a{fill:var(--accent)}
.conf-root .conf-tp{fill:var(--pass)}
.conf-root .conf-tf{fill:var(--fail)}
.conf-root .conf-tw{fill:var(--warn)}
