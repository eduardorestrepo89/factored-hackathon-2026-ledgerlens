<svg xmlns="http://www.w3.org/2000/svg" class="arch-root" viewBox="0 0 1000 940" width="100%" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">LedgerLens architecture and where the evaluation attaches</title>
<desc id="arch-desc">The customer app and the eval harness both sign in with Amazon Cognito and call AgentCore Runtime with the access token; the Runtime checks the JWT. Every request passes the override gate (eval_override.py), which honours an eval override only for the Cognito group evaluators and an allowlisted model, and then swaps only the model and the base prompt. The Strands agent calls the Bedrock model through the Bedrock Guardrail and keeps history, session context and paused tool calls in AgentCore Memory. The Runtime gets a Gateway machine token from Cognito, where the Pre-Token Lambda adds the customer_id. Each tool call passes CustomerIdHook, which overwrites the model's customer_id with the token's, and ConfirmationHook, which pauses block_credit_card, open_claim and human_agent_hand_off until a Yes or No tap. The AgentCore Gateway checks the machine token and the Cedar policy (permit when the token has a customer_id, forbid a different customer_id, forbid a block or claim without customer_confirmed true) before it invokes one of 9 Lambda tools; 8 of them use Aurora DSQL. The Runtime sends OpenTelemetry spans tagged with session.id, model.id and prompt.version to CloudWatch Transaction Search, and Gateway tracing sends policy and tool spans to X-Ray. The harness grades the SSE stream locally, which decides pass or fail, and AgentCore Evaluations scores the same sessions from the spans, which only corroborates.</desc>
